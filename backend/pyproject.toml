[project]
name = "eduai-ingestion"
version = "0.1.0"
description = "DIKSHA curriculum ingestion service for EduAI"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
eduai-ingest = "eduai_ingestion.cli:main"
eduai-api = "eduai_ingestion.api:run"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eduai_ingestion"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
